# /etc/ssh/sshd_config.d/70-tunnel.conf
# 팀원 전용 계정 tunnel: DB(5432)·API(8000) 포트 포워딩 + API 키 셀프서비스만.
# 쉘은 없다. 명령을 붙여 접속하면 무엇을 보내든 tunnel-session 만 실행된다.
Match User tunnel
    AllowTcpForwarding local
    PermitOpen localhost:5432 127.0.0.1:5432 localhost:8000 127.0.0.1:8000
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    GatewayPorts no
    ExposeAuthInfo yes
    ForceCommand /usr/local/bin/tunnel-session
