[project]
name = "battery-collector"
version = "0.1.0"
description = "PLC event mailbox → local outbox → battery-db API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
modbus = ["pymodbus>=3.10"]
mx = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8", "pymodbus>=3.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
